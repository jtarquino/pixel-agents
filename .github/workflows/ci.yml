name: CI

on:
  push:
    branches: [copilot-cli-support, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install
      - name: Install webview dependencies
        run: cd webview-ui && npm install
      - name: Type check
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
